services:
  db:
    container_name: db
    hostname: db
    image: postgres:${POSTGRES_VERSION}
    restart: always
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_db
      - postgres_password
      - postgres_user
    networks:
      - backend
      - frontend

  app:
    container_name: app
    hostname: app
    image: nextcloud:${NEXTCLOUD_VERSION}
    restart: always
    ports:
      - 127.0.0.1:9000:9000
    volumes: &nextcloud_vol
      - /mnt/nextcloud-dp/nextcloud:/var/www/html
      - /mnt/nextcloud-dp/php-settings:/usr/local/etc
      - ./crontab:/var/spool/cron/crontabs/www-data:ro
    environment: &nextcloud_env
      - VIRTUAL_HOST=${NEXTCLOUD_VIRTUAL_HOST}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_VIRTUAL_HOST}
      - REDIS_HOST=redis
    depends_on: &nextcloud_dep
      - db
      - redis
    networks: &nextcloud_net
      - backend
      - frontend

  cron:
    container_name: cron
    hostname: cron
    build:
     context: ./nextcloud
     args:
      - NEXTCLOUD_VERSION=${NEXTCLOUD_VERSION}
    restart: always
    volumes: *nextcloud_vol
    environment: *nextcloud_env
    depends_on: *nextcloud_dep
    networks: *nextcloud_net
    entrypoint: ['/usr/bin/supervisord', '-c', '/supervisord.conf']

  redis:
    container_name: redis
    hostname: redis
    image: redis:latest
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - ./redis/data:/data
    networks:
      - backend

  caddy:
    container_name: caddy
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/caddy_data:/data
      - /mnt/nextcloud-dp/nextcloud:/var/www/html
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    internal: true

secrets:
  postgres_db:
    file: ./secrets/postgres_db.txt # put postgresql db name to this file
  postgres_password:
    file: ./secrets/postgres_password.txt # put postgresql password to this file
  postgres_user:
    file: ./secrets/postgres_user.txt # put postgresql username to this file
